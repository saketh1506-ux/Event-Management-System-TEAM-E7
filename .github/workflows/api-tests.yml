name: CI Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: JavaScript Syntax, API and Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies, including better-sqlite3
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: .
        run: git ls-files -z -- '*.js' | xargs -0 -r -n1 node --check

      - name: Run unit and API tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run cross-browser UI tests
        run: npm run test:e2e
